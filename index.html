<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lux's rng</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' fill='%23020304' stroke='%232bd0d0' stroke-width='2'/%3E%3C/svg%3E">
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #020304;
  --panel: rgba(10, 16, 24, 0.92);
  --cyan: #2bd0d0;
  --cyan-bright: #5ad0ff;
  --blue: #5fa8d3;
  --text: #d8e6f2;
  --muted: #6a7a8c;
  --border: rgba(43, 208, 208, 0.35);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Consolas', 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
  user-select: none;
}

#flash {
  position: fixed;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 50;
  transition: opacity 0.1s ease-out;
}

#chromatic {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 40;
  opacity: 0;
  background:
    repeating-linear-gradient(90deg, rgba(255,0,0,0.08) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(0deg, rgba(0,255,255,0.08) 0 2px, transparent 2px 4px);
  transition: opacity 0.2s ease-out;
}

header {
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(12, 20, 30, 0.95), rgba(6, 10, 16, 0.9));
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
  z-index: 10;
}

h1 {
  font-family: Georgia, serif;
  font-size: 22px;
  letter-spacing: 4px;
  color: var(--cyan);
  text-shadow: 0 0 16px rgba(43, 208, 208, 0.45);
}

#stats {
  display: flex;
  gap: 28px;
  font-size: 13px;
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.stat span {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.stat strong {
  color: var(--cyan-bright);
  font-size: 15px;
  text-shadow: 0 0 10px rgba(90, 208, 255, 0.35);
}

main {
  flex: 1;
  display: grid;
  grid-template-columns: 260px 1fr 280px;
  gap: 16px;
  padding: 16px;
  min-height: 0;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  box-shadow: inset 0 1px 0 rgba(180, 230, 255, 0.06), 0 8px 28px rgba(0, 0, 0, 0.45);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.panel h2 {
  font-family: Georgia, serif;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--cyan);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(43, 208, 208, 0.18);
}

#rarityTable {
  overflow-y: auto;
  font-size: 11px;
}

.rarity-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 8px;
  margin-bottom: 4px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.rarity-row .dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  margin-right: 8px;
  box-shadow: 0 0 8px currentColor;
}

.rarity-row .name {
  flex: 1;
  color: var(--text);
}

.rarity-row .odds {
  color: var(--muted);
  font-size: 10px;
}

#center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

#cubeCanvas {
  width: 100%;
  height: 100%;
  border-radius: 12px;
  background: radial-gradient(ellipse at center, rgba(12, 24, 38, 0.8) 0%, rgba(2, 3, 4, 0.4) 70%);
  border: 1px solid rgba(43, 208, 208, 0.2);
  cursor: pointer;
}

#controls {
  position: absolute;
  bottom: 18px;
  display: flex;
  gap: 12px;
  z-index: 20;
}

button {
  background: linear-gradient(180deg, rgba(30, 54, 68, 0.9), rgba(14, 28, 38, 0.95));
  border: 1px solid rgba(43, 208, 208, 0.45);
  color: var(--cyan-bright);
  font-family: 'Consolas', monospace;
  font-size: 12px;
  letter-spacing: 2px;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(180, 230, 255, 0.1), 0 6px 18px rgba(0, 0, 0, 0.4);
  transition: all 0.15s ease;
}

button:hover {
  border-color: var(--cyan-bright);
  background: linear-gradient(180deg, rgba(40, 74, 92, 0.92), rgba(18, 38, 52, 0.96));
  box-shadow: inset 0 1px 0 rgba(180, 230, 255, 0.15), 0 0 18px rgba(43, 208, 208, 0.35);
  transform: translateY(-1px);
}

button:active {
  transform: translateY(1px);
}

button.active {
  border-color: #ff9ecd;
  color: #ffd7ec;
  box-shadow: inset 0 1px 0 rgba(255, 210, 230, 0.15), 0 0 18px rgba(255, 158, 207, 0.35);
}

#inventory {
  overflow-y: auto;
}

.inv-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  margin-bottom: 6px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  transition: background 0.15s;
}

.inv-item:hover {
  background: rgba(255, 255, 255, 0.07);
}

.inv-item .icon {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  box-shadow: 0 0 10px currentColor;
  flex-shrink: 0;
}

.inv-item .info {
  flex: 1;
  min-width: 0;
}

.inv-item .name {
  font-size: 12px;
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.inv-item .count {
  font-size: 10px;
  color: var(--muted);
}

.inv-item .bonus {
  font-size: 10px;
  color: var(--cyan-bright);
  text-align: right;
}

#rollText {
  position: absolute;
  top: 14%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
  z-index: 25;
  opacity: 0;
  transition: opacity 0.15s;
}

#rollText .rarity-name {
  font-family: Georgia, serif;
  font-size: 28px;
  letter-spacing: 4px;
  text-shadow: 0 0 24px currentColor;
}

#rollText .rarity-tag {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--muted);
  margin-top: 4px;
}

#lastRoll {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid rgba(43, 208, 208, 0.18);
  font-size: 11px;
  color: var(--muted);
}

#lastRoll strong {
  color: var(--text);
}

::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.2);
}

::-webkit-scrollbar-thumb {
  background: rgba(43, 208, 208, 0.25);
  border-radius: 3px;
}

#headerButtons {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: 18px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(2, 3, 4, 0.82);
  backdrop-filter: blur(6px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
}

.modal.open {
  display: flex;
}

.modal-window {
  width: 460px;
  max-width: 92vw;
  max-height: 86vh;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(180, 230, 255, 0.06);
  display: flex;
  flex-direction: column;
}

.modal-window h2 {
  font-family: Georgia, serif;
  font-size: 16px;
  letter-spacing: 3px;
  color: var(--cyan);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(43, 208, 208, 0.18);
}

.modal-window .credit-line {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 14px;
}

.modal-window .credit-line strong {
  color: var(--cyan-bright);
}

#achievementsList, #changelogList {
  overflow-y: auto;
  font-size: 11px;
}

.shop-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.shop-item .info {
  flex: 1;
}

.shop-item .name {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 2px;
}

.shop-item .desc {
  font-size: 10px;
  color: var(--muted);
}

.shop-item button {
  padding: 8px 14px;
  font-size: 11px;
}

.shop-item button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  border-color: rgba(43, 208, 208, 0.25);
  color: var(--muted);
}

.shop-item.owned {
  border-color: rgba(43, 208, 208, 0.25);
  opacity: 0.7;
}

.shop-item.owned .name::after {
  content: ' (owned)';
  color: var(--cyan-bright);
  font-size: 10px;
}

#shopClose {
  margin-top: 10px;
  align-self: center;
}

.achievement {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  opacity: 0.45;
}

.achievement.unlocked {
  opacity: 1;
  border-color: rgba(43, 208, 208, 0.35);
  background: rgba(43, 208, 208, 0.08);
}

.achievement .icon {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  background: rgba(10, 16, 24, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.1);
  flex-shrink: 0;
}

.achievement.unlocked .icon {
  background: rgba(43, 208, 208, 0.2);
  border-color: rgba(43, 208, 208, 0.5);
}

.achievement .info {
  flex: 1;
}

.achievement .name {
  font-size: 12px;
  color: var(--text);
  margin-bottom: 2px;
}

.achievement .desc {
  font-size: 10px;
  color: var(--muted);
}

.achievement .reward {
  font-size: 10px;
  color: var(--cyan-bright);
  text-align: right;
}

.changelog-item {
  padding: 8px 0;
  border-bottom: 1px solid rgba(43, 208, 208, 0.1);
}

.changelog-item:last-child {
  border-bottom: none;
}

.changelog-item .version {
  color: var(--cyan);
  font-size: 12px;
  letter-spacing: 1px;
  margin-bottom: 2px;
}

.changelog-item .note {
  color: var(--muted);
  font-size: 10px;
}

#toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(10, 16, 24, 0.95);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 18px;
  color: var(--cyan-bright);
  font-size: 12px;
  letter-spacing: 1px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

#toast.show {
  opacity: 1;
}

button.locked {
  position: relative;
  border-color: rgba(255, 60, 120, 0.45);
  color: #ff9ecd;
}

button.locked::after {
  content: '🔒';
  margin-left: 6px;
  font-size: 10px;
}
  </style>
</head>
<body>
  <div id="flash"></div>
  <div id="chromatic"></div>

  <header>
    <h1>LUX'S RNG</h1>
    <div style="display:flex;align-items:center">
      <div id="stats">
        <div class="stat"><span>luck</span><strong id="luck">1x</strong></div>
        <div class="stat"><span>speed</span><strong id="speed">1/s</strong></div>
        <div class="stat"><span>rolls</span><strong id="rolls">0</strong></div>
        <div class="stat"><span>credits</span><strong id="credits">0</strong></div>
      </div>
      <div id="headerButtons">
        <button id="achievementsBtn">ACHIEVEMENTS</button>
        <button id="changelogBtn">UPDATE LOG</button>
        <button id="shopBtn">SHOP</button>
      </div>
    </div>
  </header>

  <main>
    <aside class="panel">
      <h2>RARITY ODDS</h2>
      <div id="rarityTable"></div>
    </aside>

    <section id="center">
      <canvas id="cubeCanvas"></canvas>
      <div id="rollText">
        <div class="rarity-name">Dust</div>
        <div class="rarity-tag">CUBE ROLLED</div>
      </div>
      <div id="controls">
        <button id="rollBtn">ROLL</button>
        <button id="autoBtn">AUTO</button>
        <button data-mult="1" class="active">x1</button>
        <button data-mult="10">x10</button>
        <button data-mult="100">x100</button>
      </div>
    </section>

    <aside class="panel">
      <h2>INVENTORY</h2>
      <div id="inventory"></div>
      <div id="lastRoll">last roll: <strong>-</strong></div>
    </aside>
  </main>

  <div id="shopModal" class="modal">
    <div id="shopWindow" class="modal-window">
      <h2>UPGRADE SHOP</h2>
      <div class="credit-line">credits: <strong id="shopCredits">0</strong></div>
      <div id="shopItems"></div>
      <button id="shopClose" class="modal-close">CLOSE</button>
    </div>
  </div>

  <div id="achievementsModal" class="modal">
    <div id="achievementsWindow" class="modal-window">
      <h2>ACHIEVEMENTS</h2>
      <div id="achievementsList"></div>
      <button id="achievementsClose" class="modal-close">CLOSE</button>
    </div>
  </div>

  <div id="changelogModal" class="modal">
    <div id="changelogWindow" class="modal-window">
      <h2>UPDATE LOG</h2>
      <div id="changelogList"></div>
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(43,208,208,0.18)">
        <div class="credit-line">best roll: <strong id="bestRollStat">-</strong></div>
        <div class="credit-line">playtime: <strong id="playtimeStat">0s</strong></div>
        <button id="resetSaveBtn" style="margin-top:8px;width:100%;border-color:rgba(255,60,120,0.45);color:#ff9ecd">RESET SAVE</button>
      </div>
      <button id="changelogClose" class="modal-close">CLOSE</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
const canvas = document.getElementById('cubeCanvas');
const ctx = canvas.getContext('2d');
const flash = document.getElementById('flash');
const chromatic = document.getElementById('chromatic');
const rollText = document.getElementById('rollText');
const rarityTable = document.getElementById('rarityTable');
const inventoryEl = document.getElementById('inventory');
const lastRollEl = document.getElementById('lastRoll');
const luckEl = document.getElementById('luck');
const speedEl = document.getElementById('speed');
const rollsEl = document.getElementById('rolls');
const creditsEl = document.getElementById('credits');
const shopBtn = document.getElementById('shopBtn');
const shopModal = document.getElementById('shopModal');
const shopItems = document.getElementById('shopItems');
const shopCredits = document.getElementById('shopCredits');
const shopClose = document.getElementById('shopClose');
const achievementsBtn = document.getElementById('achievementsBtn');
const achievementsModal = document.getElementById('achievementsModal');
const achievementsList = document.getElementById('achievementsList');
const achievementsClose = document.getElementById('achievementsClose');
const changelogBtn = document.getElementById('changelogBtn');
const changelogModal = document.getElementById('changelogModal');
const changelogList = document.getElementById('changelogList');
const changelogClose = document.getElementById('changelogClose');
const toast = document.getElementById('toast');
const bestRollStat = document.getElementById('bestRollStat');
const playtimeStat = document.getElementById('playtimeStat');
const resetSaveBtn = document.getElementById('resetSaveBtn');

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const upgrades = [
  { id: 'auto', name: 'Auto Roll', desc: 'rolls automatically based on speed', cost: 100, type: 'unlock' },
  { id: 'x10', name: 'x10 Multiplier', desc: 'roll 10 cubes at once', cost: 500, type: 'unlock' },
  { id: 'x100', name: 'x100 Multiplier', desc: 'roll 100 cubes at once', cost: 2500, type: 'unlock' },
  { id: 'luckBracelet', name: 'Luck Bracelet', desc: '+0.5 permanent luck', cost: 1000, type: 'stack', effect: { luck: 0.5 }, max: 10 },
  { id: 'speedBracelet', name: 'Speed Bracelet', desc: '+0.2 permanent speed', cost: 1000, type: 'stack', effect: { speed: 0.2 }, max: 10 },
  { id: 'luckyGloves', name: 'Lucky Gloves', desc: '+2 permanent luck', cost: 5000, type: 'stack', effect: { luck: 2 }, max: 5 },
  { id: 'hasteBoots', name: 'Haste Boots', desc: '+1 permanent speed', cost: 5000, type: 'stack', effect: { speed: 1 }, max: 5 },
  { id: 'fortuneTalisman', name: 'Fortune Talisman', desc: '+10 permanent luck', cost: 25000, type: 'stack', effect: { luck: 10 }, max: 3 },
  { id: 'swiftTalisman', name: 'Swift Talisman', desc: '+5 permanent speed', cost: 25000, type: 'stack', effect: { speed: 5 }, max: 3 },
];

const achievements = [
  { id: 'roll10', name: 'Just Getting Started', desc: 'roll 10 times', check: () => rolls >= 10, reward: { luck: 0.1 } },
  { id: 'roll100', name: 'Dedication', desc: 'roll 100 times', check: () => rolls >= 100, reward: { luck: 0.25 } },
  { id: 'roll1000', name: 'Addicted', desc: 'roll 1,000 times', check: () => rolls >= 1000, reward: { luck: 0.75 } },
  { id: 'roll10000', name: 'No Life', desc: 'roll 10,000 times', check: () => rolls >= 10000, reward: { luck: 2 } },
  { id: 'roll100000', name: 'Touch Grass', desc: 'roll 100,000 times', check: () => rolls >= 100000, reward: { luck: 5 } },
  { id: 'credits100', name: 'Pocket Change', desc: 'earn 100 credits', check: () => credits >= 100, reward: { speed: 0.1 } },
  { id: 'credits1000', name: 'Big Spender', desc: 'earn 1,000 credits', check: () => credits >= 1000, reward: { speed: 0.25 } },
  { id: 'credits10000', name: 'Economy Crusher', desc: 'earn 10,000 credits', check: () => credits >= 10000, reward: { speed: 0.75 } },
  { id: 'rare', name: 'First Spark', desc: 'roll a Rare cube', check: () => (inventory['Rare'] || 0) > 0, reward: { luck: 0.15 } },
  { id: 'celestial', name: 'Divine Light', desc: 'roll a Celestial cube', check: () => (inventory['Celestial'] || 0) > 0, reward: { luck: 0.25 } },
  { id: 'epic', name: 'Purple Haze', desc: 'roll an Epic cube', check: () => (inventory['Epic'] || 0) > 0, reward: { luck: 0.35 } },
  { id: 'frosted', name: 'Ice Cold', desc: 'roll a Frosted cube', check: () => (inventory['Frosted'] || 0) > 0, reward: { luck: 0.5 } },
  { id: 'legendary', name: 'Golden Child', desc: 'roll a Legendary cube', check: () => (inventory['Legendary'] || 0) > 0, reward: { luck: 1 } },
  { id: 'auric', name: 'Gold Rush', desc: 'roll an Auric cube', check: () => (inventory['Auric'] || 0) > 0, reward: { speed: 0.25 } },
  { id: 'mythic', name: 'Red Alert', desc: 'roll a Mythic cube', check: () => (inventory['Mythic'] || 0) > 0, reward: { speed: 0.5 } },
  { id: 'mystic', name: 'Wizard', desc: 'roll a Mystic cube', check: () => (inventory['Mystic'] || 0) > 0, reward: { luck: 3 } },
  { id: 'divine', name: 'Blessed', desc: 'roll a Divine cube', check: () => (inventory['Divine'] || 0) > 0, reward: { speed: 1 } },
  { id: 'nebula', name: 'Space Walk', desc: 'roll a Nebula cube', check: () => (inventory['Nebula'] || 0) > 0, reward: { luck: 5 } },
  { id: 'cosmic', name: 'Star Born', desc: 'roll a Cosmic cube', check: () => (inventory['Cosmic'] || 0) > 0, reward: { luck: 8 } },
  { id: 'ascended', name: 'Above All', desc: 'roll an Ascended cube', check: () => (inventory['Ascended'] || 0) > 0, reward: { speed: 3 } },
  { id: 'null', name: 'Error 404', desc: 'roll a Null cube', check: () => (inventory['Null'] || 0) > 0, reward: { luck: 15 } },
  { id: 'radiant', name: 'Glory', desc: 'roll a Radiant cube', check: () => (inventory['Radiant'] || 0) > 0, reward: { luck: 25 } },
  { id: 'secret', name: '????', desc: 'roll a ??? cube', check: () => (inventory['???'] || 0) > 0, reward: { luck: 50 } },
  { id: 'unlockAuto', name: 'Lazy Mode', desc: 'buy auto roll', check: () => unlocked.auto, reward: { speed: 0.1 } },
  { id: 'unlockX10', name: 'Bulk Buyer', desc: 'buy x10 multiplier', check: () => unlocked.x10, reward: { luck: 0.2 } },
  { id: 'unlockX100', name: 'Whale', desc: 'buy x100 multiplier', check: () => unlocked.x100, reward: { luck: 1 } },
];

const changelog = [
  { version: 'v0.5', note: 'added 8 original new rarities + stackable shop gear (bracelets, gloves, talismans)' },
  { version: 'v0.4', note: 'added achievements that give permanent luck/speed boosts + update log' },
  { version: 'v0.3', note: 'added localStorage save/load, nerfed auto roll to half speed' },
  { version: 'v0.2', note: 'added shop: auto roll, x10, x100 locked behind credits' },
  { version: 'v0.1', note: 'initial release: rolling, rarities, inventory, particles' },
];

let achievementsUnlocked = {};

  { name: 'Dust',        odds: 1.5,        cap: 2,          color: '#8a9199', glow: '#aab4bd', luck: 0.1,     speed: 0.02,  particles: 12,  shake: 2,    flash: 0.02, chroma: 0 },

let inventory = {};
let baseLuck = 1;
let rolls = 0;
let credits = 0;
let autoRoll = false;
let multiplier = 1;
let unlocked = { auto: false, x10: false, x100: false };
let shopCounts = { luckBracelet: 0, speedBracelet: 0, luckyGloves: 0, hasteBoots: 0, fortuneTalisman: 0, swiftTalisman: 0 };
let currentRarity = rarities[0];
let particles = [];
let shake = 0;
let chroma = 0;
let cubeRot = 0;
let lastRollTime = 0;
let bestRarityIndex = 0;
let startTime = Date.now();
let autoInterval = 1000;

function formatNum(n) {
  if (n < 1000) return n.toFixed(n < 10 ? 2 : 0);
  const suffixes = ['K','M','B','T','qd','Qn','sx','Sp','O','N','de'];
  const exp = Math.floor(Math.log10(n) / 3);
  if (exp >= suffixes.length) return n.toExponential(2);
  const short = n / Math.pow(10, exp * 3);
  return short.toFixed(2) + suffixes[exp - 1];
}

function getAchievementBonus() {
  let luck = 0, speed = 0;
  for (const a of achievements) {
    if (achievementsUnlocked[a.id]) {
      luck += a.reward.luck || 0;
      speed += a.reward.speed || 0;
    }
  }
  return { luck, speed };
}

function getShopBonus() {
  let luck = 0, speed = 0;
  for (const up of upgrades) {
    if (up.type === 'stack') {
      const count = shopCounts[up.id] || 0;
      luck += count * (up.effect.luck || 0);
      speed += count * (up.effect.speed || 0);
    }
  }
  return { luck, speed };
}

function getTotals() {
  const ab = getAchievementBonus();
  const sb = getShopBonus();
  let luck = baseLuck + ab.luck + sb.luck;
  let speed = 1 + ab.speed + sb.speed;
  for (const r of rarities) {
    const count = inventory[r.name] || 0;
    luck += count * r.luck;
    speed += count * r.speed;
  }
  return { luck, speed };
}

function getProbabilities() {
  const totals = getTotals();
  const luck = totals.luck;
  const weights = rarities.map(r => {
    const eff = Math.min(r.odds <= 1 ? 1 : (1 / r.odds) * luck, (1 / r.odds) * r.cap);
    return eff;
  });
  const total = weights.reduce((a, b) => a + b, 0);
  return weights.map(w => w / total);
}

function rollOne() {
  const probs = getProbabilities();
  const x = Math.random();
  let cum = 0;
  for (let i = 0; i < rarities.length; i++) {
    cum += probs[i];
    if (x <= cum) return rarities[i];
  }
  return rarities[rarities.length - 1];
}

function triggerRoll(count = 1) {
  let best = null;
  for (let i = 0; i < count; i++) {
    const r = rollOne();
    inventory[r.name] = (inventory[r.name] || 0) + 1;
    baseLuck += 0.02;
    rolls++;
    credits += multiplier;
    if (!best || rarities.indexOf(r) > rarities.indexOf(best)) best = r;
  }
  currentRarity = best;
  const idx = rarities.indexOf(best);
  if (idx > bestRarityIndex) bestRarityIndex = idx;
  triggerEffects(best);
  playTone(idx);
  updateUI();
  showRollText(best);
  checkAchievements();
  saveGame();
}

function triggerEffects(r) {
  shake = Math.max(shake, r.shake);
  chroma = Math.min(1, chroma + r.chroma);
  flash.style.opacity = r.flash;
  setTimeout(() => { flash.style.opacity = 0; }, 80);
  spawnParticles(r.particles, r.color, r.glow);
}

function spawnParticles(n, color, glow) {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 8;
    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 1,
      decay: 0.01 + Math.random() * 0.02,
      size: 2 + Math.random() * 4,
      color,
      glow
    });
  }
}

function playTone(rarityIndex) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = rarityIndex > 7 ? 'sawtooth' : 'sine';
  osc.frequency.value = 220 + rarityIndex * 90 + Math.random() * 40;
  gain.gain.value = 0.05;
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}

function showRollText(r) {
  rollText.querySelector('.rarity-name').textContent = r.name;
  rollText.querySelector('.rarity-name').style.color = r.color === 'rainbow' ? '#fff' : r.color === 'prism' ? '#fff' : r.color;
  rollText.querySelector('.rarity-tag').textContent = 'CUBE ROLLED';
  rollText.style.opacity = 1;
  rollText.style.transform = 'translateX(-50%) scale(1.1)';
  lastRollTime = Date.now();
  setTimeout(() => {
    if (Date.now() - lastRollTime >= 900) {
      rollText.style.opacity = 0;
      rollText.style.transform = 'translateX(-50%) scale(1)';
    }
  }, 1000);
}

function getRarityColor(r, t) {
  if (r.color === 'rainbow') {
    const hue = (t * 120) % 360;
    return `hsl(${hue}, 90%, 60%)`;
  }
  if (r.color === 'prism') {
    const hue = (t * 240) % 360;
    return `hsl(${hue}, 100%, 70%)`;
  }
  return r.color;
}

function draw() {
  const t = Date.now() / 1000;
  const w = canvas.width;
  const h = canvas.height;

  ctx.save();
  if (shake > 0) {
    const s = shake;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    shake *= 0.92;
    if (shake < 0.3) shake = 0;
  }

  ctx.clearRect(0, 0, w, h);

  const grad = ctx.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, Math.max(w, h) * 0.6);
  grad.addColorStop(0, 'rgba(20, 40, 58, 0.35)');
  grad.addColorStop(1, 'rgba(2, 3, 4, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const size = Math.min(w, h) * 0.22;
  const cx = w / 2;
  const cy = h / 2;
  cubeRot += 0.01 + (getTotals().speed * 0.002);

  const col = getRarityColor(currentRarity, t);
  const glow = currentRarity.glow;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(cubeRot);

  ctx.shadowColor = glow;
  ctx.shadowBlur = 40 + Math.sin(t * 4) * 10;
  ctx.fillStyle = col;
  ctx.strokeStyle = glow;
  ctx.lineWidth = 2;
  ctx.fillRect(-size / 2, -size / 2, size, size);
  ctx.strokeRect(-size / 2, -size / 2, size, size);

  ctx.globalAlpha = 0.25;
  ctx.beginPath();
  ctx.moveTo(-size / 2, -size / 2);
  ctx.lineTo(size / 2, size / 2);
  ctx.moveTo(size / 2, -size / 2);
  ctx.lineTo(-size / 2, size / 2);
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.restore();

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= p.decay;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    const pc = getRarityColor({ color: p.color }, t);
    ctx.globalAlpha = p.life;
    ctx.fillStyle = pc;
    ctx.shadowColor = p.glow;
    ctx.shadowBlur = 8;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    ctx.globalAlpha = 1;
  }
  ctx.shadowBlur = 0;

  ctx.restore();

  chromatic.style.opacity = Math.max(0, chroma * 0.35);
  chroma *= 0.96;
  if (chroma < 0.01) chroma = 0;

  requestAnimationFrame(draw);
}

function updateUI() {
  const totals = getTotals();
  luckEl.textContent = formatNum(totals.luck) + 'x';
  speedEl.textContent = formatNum(totals.speed) + '/s';
  rollsEl.textContent = formatNum(rolls);
  creditsEl.textContent = formatNum(credits);

  autoInterval = 2000 / totals.speed;

  renderControls();
  renderShop();
  renderRarityTable(totals.luck);
  renderInventory();
  lastRollEl.innerHTML = `last roll: <strong style="color:${currentRarity.color === 'rainbow' ? '#fff' : currentRarity.color === 'prism' ? '#fff' : currentRarity.color}">${currentRarity.name}</strong>`;

  const best = rarities[bestRarityIndex];
  bestRollStat.innerHTML = `<span style="color:${best.color === 'rainbow' ? '#fff' : best.color === 'prism' ? '#fff' : best.color}">${best.name}</span>`;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const pt = elapsed < 60 ? elapsed + 's' : elapsed < 3600 ? Math.floor(elapsed / 60) + 'm ' + (elapsed % 60) + 's' : Math.floor(elapsed / 3600) + 'h ' + Math.floor((elapsed % 3600) / 60) + 'm';
  playtimeStat.textContent = pt;
}

function renderRarityTable(luck) {
  const probs = getProbabilities();
  rarityTable.innerHTML = '';
  for (let i = rarities.length - 1; i >= 0; i--) {
    const r = rarities[i];
    const p = probs[i];
    const odds = p > 0 ? Math.round(1 / p) : '∞';
    const row = document.createElement('div');
    row.className = 'rarity-row';
    row.innerHTML = `
      <div style="display:flex;align-items:center;flex:1">
        <div class="dot" style="background:${r.color === 'rainbow' ? 'linear-gradient(45deg,#f0a,#0ff,#8f0)' : r.color === 'prism' ? 'conic-gradient(#f0a,#0ff,#8f0,#f0a)' : r.color}; color:${r.color}"></div>
        <span class="name">${r.name}</span>
      </div>
      <span class="odds">1/${formatNum(odds)}</span>
    `;
    rarityTable.appendChild(row);
  }
}

function renderInventory() {
  inventoryEl.innerHTML = '';
  const list = rarities.slice().reverse().filter(r => inventory[r.name]);
  if (list.length === 0) {
    inventoryEl.innerHTML = '<div style="color:var(--muted);font-size:11px;text-align:center;padding-top:20px">no auras yet. roll.</div>';
    return;
  }
  for (const r of list) {
    const count = inventory[r.name];
    const item = document.createElement('div');
    item.className = 'inv-item';
    item.innerHTML = `
      <div class="icon" style="background:${r.color === 'rainbow' ? 'linear-gradient(45deg,#f0a,#0ff,#8f0)' : r.color === 'prism' ? 'conic-gradient(#f0a,#0ff,#8f0,#f0a)' : r.color}; color:${r.color}"></div>
      <div class="info">
        <div class="name" style="color:${r.color === 'rainbow' || r.color === 'prism' ? '#fff' : r.color}">${r.name}</div>
        <div class="count">x${formatNum(count)}</div>
      </div>
      <div class="bonus">+${formatNum(count * r.luck)}x luck<br>+${formatNum(count * r.speed)}/s</div>
    `;
    inventoryEl.appendChild(item);
  }
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

function setMultiplier(n) {
  const key = n === 1 ? null : (n === 10 ? 'x10' : 'x100');
  if (key && !unlocked[key]) return;
  multiplier = n;
  renderControls();
}

function toggleAuto() {
  if (!unlocked.auto) return;
  autoRoll = !autoRoll;
  document.getElementById('autoBtn').classList.toggle('active', autoRoll);
}

function renderControls() {
  const autoBtn = document.getElementById('autoBtn');
  autoBtn.classList.toggle('active', autoRoll);
  autoBtn.classList.toggle('locked', !unlocked.auto);
  autoBtn.textContent = unlocked.auto ? 'AUTO' : 'AUTO 100';

  document.querySelectorAll('#controls button[data-mult]').forEach(b => {
    const n = parseInt(b.dataset.mult);
    const key = n === 10 ? 'x10' : 'x100';
    const own = n === 1 || unlocked[key];
    b.classList.toggle('active', multiplier === n);
    b.classList.toggle('locked', !own);
    b.textContent = own ? 'x' + n : 'x' + n + ' ' + upgrades.find(u => u.id === key).cost;
  });
}

function openShop() {
  shopModal.classList.add('open');
  renderShop();
}

function closeShop() {
  shopModal.classList.remove('open');
}

function buyUpgrade(id) {
  const up = upgrades.find(u => u.id === id);
  if (up.type === 'unlock') {
    if (unlocked[id] || credits < up.cost) return;
    credits -= up.cost;
    unlocked[id] = true;
    if (id === 'x10' && multiplier === 100 && !unlocked.x100) multiplier = 1;
    if (id === 'auto') autoRoll = true;
  } else {
    const count = shopCounts[id] || 0;
    if (count >= up.max || credits < up.cost) return;
    credits -= up.cost;
    shopCounts[id] = count + 1;
  }
  renderControls();
  renderShop();
  updateUI();
  saveGame();
}

function renderShop() {
  shopCredits.textContent = formatNum(credits);
  shopItems.innerHTML = '';
  for (const up of upgrades) {
    const isUnlock = up.type === 'unlock';
    const owned = isUnlock && unlocked[up.id];
    const count = shopCounts[up.id] || 0;
    const maxed = !isUnlock && count >= up.max;
    const canBuy = credits >= up.cost && !owned && !maxed;
    const item = document.createElement('div');
    item.className = 'shop-item' + ((owned || maxed) ? ' owned' : '');
    const countText = isUnlock ? '' : ` (${count}/${up.max})`;
    item.innerHTML = `
      <div class="info">
        <div class="name">${up.name}${countText}</div>
        <div class="desc">${up.desc}</div>
      </div>
      <button ${canBuy ? '' : 'disabled'}>${owned ? 'OWNED' : maxed ? 'MAXED' : up.cost + ' CR'}</button>
    `;
    if (!owned && !maxed) {
      item.querySelector('button').addEventListener('click', () => buyUpgrade(up.id));
    }
    shopItems.appendChild(item);
  }
}

function renderAchievements() {
  achievementsList.innerHTML = '';
  for (const a of achievements) {
    const own = achievementsUnlocked[a.id];
    const el = document.createElement('div');
    el.className = 'achievement' + (own ? ' unlocked' : '');
    const rwd = [];
    if (a.reward.luck) rwd.push('+' + a.reward.luck + ' luck');
    if (a.reward.speed) rwd.push('+' + a.reward.speed + ' speed');
    el.innerHTML = `
      <div class="icon">${own ? '★' : '☆'}</div>
      <div class="info">
        <div class="name">${a.name}</div>
        <div class="desc">${a.desc}</div>
      </div>
      <div class="reward">${rwd.join('<br>')}</div>
    `;
    achievementsList.appendChild(el);
  }
}

function renderChangelog() {
  changelogList.innerHTML = '';
  for (const c of changelog) {
    const el = document.createElement('div');
    el.className = 'changelog-item';
    el.innerHTML = `<div class="version">${c.version}</div><div class="note">${c.note}</div>`;
    changelogList.appendChild(el);
  }
}

resetSaveBtn.addEventListener('click', resetSave);

const SAVE_VERSION = 2;

function saveGame() {
  try {
    localStorage.setItem('luxRngSave', JSON.stringify({
      saveVersion: SAVE_VERSION, inventory, baseLuck, rolls, credits, unlocked, shopCounts, multiplier, autoRoll, achievementsUnlocked, bestRarityIndex, startTime
    }));
  } catch (e) {}
}

function loadGame() {
  try {
    const raw = localStorage.getItem('luxRngSave');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.inventory) inventory = data.inventory;
    if (typeof data.baseLuck === 'number') baseLuck = data.baseLuck;
    if (typeof data.rolls === 'number') rolls = data.rolls;
    if (typeof data.credits === 'number') credits = data.credits;
    if (data.unlocked) unlocked = { ...unlocked, ...data.unlocked };
    if (data.shopCounts) shopCounts = { ...shopCounts, ...data.shopCounts };
    if (typeof data.multiplier === 'number') multiplier = data.multiplier;
    if (typeof data.autoRoll === 'boolean') autoRoll = data.autoRoll;
    if (data.achievementsUnlocked) achievementsUnlocked = { ...achievementsUnlocked, ...data.achievementsUnlocked };
    if (typeof data.startTime === 'number') startTime = data.startTime;
    if (typeof data.bestRarityIndex === 'number' && data.saveVersion === SAVE_VERSION) bestRarityIndex = data.bestRarityIndex;

    // migrate renamed rarities from pre-original-name saves
    const renameMap = { Divinus: 'Celestial', Crystallized: 'Frosted', Gilded: 'Auric', Arcane: 'Mystic', Galaxy: 'Nebula', Exalted: 'Ascended', Glorious: 'Radiant' };
    for (const [oldName, newName] of Object.entries(renameMap)) {
      if (inventory[oldName]) {
        inventory[newName] = (inventory[newName] || 0) + inventory[oldName];
        delete inventory[oldName];
      }
    }
  } catch (e) {}
}

function showToast(text) {
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function resetSave() {
  if (!confirm('reset all progress? this cannot be undone.')) return;
  inventory = {};
  baseLuck = 1;
  rolls = 0;
  credits = 0;
  autoRoll = false;
  multiplier = 1;
  unlocked = { auto: false, x10: false, x100: false };
  shopCounts = { luckBracelet: 0, speedBracelet: 0, luckyGloves: 0, hasteBoots: 0, fortuneTalisman: 0, swiftTalisman: 0 };
  achievementsUnlocked = {};
  bestRarityIndex = 0;
  startTime = Date.now();
  currentRarity = rarities[0];
  localStorage.removeItem('luxRngSave');
  updateUI();
  showToast('save reset');
}

function checkAchievements() {
  let newUnlock = false;
  for (const a of achievements) {
    if (!achievementsUnlocked[a.id] && a.check()) {
      achievementsUnlocked[a.id] = true;
      newUnlock = true;
      showToast('achievement unlocked: ' + a.name);
    }
  }
  if (newUnlock) {
    saveGame();
    renderAchievements();
  }
}

let lastAuto = 0;
function loop(ts) {
  if (autoRoll) {
    if (ts - lastAuto > autoInterval) {
      triggerRoll(multiplier);
      lastAuto = ts;
    }
  }
  requestAnimationFrame(loop);
}

loadGame();
resize();
updateUI();
draw();
requestAnimationFrame(loop);
  </script>
</body>
</html>
